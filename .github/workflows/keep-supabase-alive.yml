name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 every 3 days
    - cron: '0 0 */3 * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          echo "Pinging Supabase to prevent automatic pausing..."
          curl -s -o /dev/null -w "%{http_code}" https://wemxpknyxvlpxbmxuruj.supabase.co/rest/v1/
          echo "Supabase successfully pinged!"
